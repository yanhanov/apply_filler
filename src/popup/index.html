<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apply Filler</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 128 128" width="28" height="28" fill="none">
              <g transform="translate(6 3)">
                <rect x="22" y="14" width="78" height="100" rx="12" fill="#DADCE0"/>
              </g>
              <rect x="22" y="14" width="78" height="100" rx="12" fill="#FFFFFF"/>
              <rect x="22" y="14" width="78" height="100" rx="12" stroke="#E8EAED" stroke-width="1.5"/>
              <rect x="36" y="36" width="50" height="7" rx="3.5" fill="#E8EAED"/>
              <rect x="36" y="52" width="50" height="7" rx="3.5" fill="#E8EAED"/>
              <rect x="36" y="68" width="34" height="7" rx="3.5" fill="#4285F4"/>
              <rect x="36" y="84" width="42" height="7" rx="3.5" fill="#E8EAED"/>
              <path d="M76 14h12c6.6 0 12 5.4 12 12v12H88c-6.6 0-12-5.4-12-12V14z" fill="#E8EAED"/>
              <path d="M76 14v12c0 6.6 5.4 12 12 12h12L76 14z" fill="#F8F9FA"/>
              <circle cx="92" cy="98" r="20" fill="#34A853"/>
              <path
                d="M83 98.4l5.8 5.8 12.4-13.2"
                stroke="#FFFFFF"
                stroke-width="5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <div class="brand-text">
            <strong class="logo">Apply Filler</strong>
            <span class="tag">Profile + Gemini</span>
          </div>
        </div>
        <a href="#" id="open-options" class="profile-link">Profile</a>
      </header>

      <p class="sub">Fills known fields from your profile; Gemini drafts cover letters and open questions when a key is set.</p>

      <button type="button" id="fill-btn">
        <span class="btn-label">Fill application</span>
        <span class="btn-arrow" aria-hidden="true">→</span>
      </button>

      <div id="result" class="result" hidden>
        <p id="status" class="status" role="status"></p>
        <pre id="debug" class="debug" hidden></pre>
      </div>
    </div>
    <script type="module" src="main.ts"></script>
  </body>
</html>
