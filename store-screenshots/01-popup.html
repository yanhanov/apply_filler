    <div class="chrome-bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="chrome-title">Apply Filler</span></div>

      <div class="top">
        <div class="brand">
          <img src="../public/icons/icon48.png" width="28" height="28" alt="">
          <div><strong>Apply Filler</strong><span>Profile + Gemini</span></div>
        </div>
        <div class="profile">Profile</div>
      </div>

      <button class="fill"><span>Fill application</span><span>→</span></button>
    </div>
  </div>
